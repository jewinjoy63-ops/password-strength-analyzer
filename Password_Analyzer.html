<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptographic Password Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6 transition-all duration-300">
        
        <div class="text-center space-y-2">
            <div class="inline-flex p-3 bg-indigo-500/10 text-indigo-400 rounded-xl mb-1">
                <i class="fa-solid fa-shield-halved text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Password Strength Analyzer</h1>
            <p class="text-sm text-slate-400">Evaluate strength and cryptographic uniqueness.</p>
        </div>

        <div class="space-y-2">
            <label for="passwordInput" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Enter Password</label>
            <div class="relative">
                <input id="passwordInput" type="password" 
                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition duration-200 pr-10"
                       placeholder="Type a password...">
                <button id="toggleVisibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 focus:outline-none">
                    <i class="fa-solid fa-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <div class="space-y-2">
            <div class="flex justify-between text-xs font-medium">
                <span class="text-slate-400">Strength Rating:</span>
                <span id="strengthText" class="text-slate-500 font-bold">Empty</span>
            </div>
            <div class="w-full h-2 bg-slate-950 rounded-full overflow-hidden">
                <div id="strengthBar" class="h-full w-0 bg-slate-600 transition-all duration-500 ease-out"></div>
            </div>
        </div>

        <div id="feedbackPanel" class="space-y-2 text-sm hidden">
            <div id="reuseAlert" class="hidden p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-xl flex items-start gap-2.5">
                <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
                <div>
                    <span class="font-semibold block text-xs uppercase tracking-wider">Reuse Detection</span>
                    This matches a previously used hash in our database! Change it to avoid credential stuffing.
                </div>
            </div>
            
            <div class="p-3 bg-slate-950/40 rounded-xl border border-slate-700/50 space-y-1.5" id="requirementList">
                </div>
        </div>

        <hr class="border-slate-700/50">

        <div class="bg-indigo-950/20 border border-indigo-500/10 rounded-xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-400">Smart Alternative</span>
                <button id="generateBtn" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1 focus:outline-none">
                    <i class="fa-solid fa-rotate"></i> Regenerate
                </button>
            </div>
            <div class="flex items-center justify-between bg-slate-950/80 px-3 py-2.5 rounded-lg border border-indigo-500/20 font-mono text-sm text-indigo-200 break-all select-all">
                <span id="suggestedPass">--------</span>
                <button id="copyBtn" class="text-slate-500 hover:text-slate-300 p-1 focus:outline-none ml-2" title="Copy to clipboard">
                    <i class="fa-regular fa-copy" id="copyIcon"></i>
                </button>
            </div>
        </div>

    </div>

    <script>
        // SHA-256 Hashes of common/mock-previously used passwords
        // e.g., "Password123!" and "LetMeIn2026@"
        const MOCK_PASSWORD_DB_HASHES = [
            "7c0c16b17da2363fcf102871b6ba0c6f50b4ec1a8685e13d115e47895e69e061",
            "4bfad94680bda482db0b12bc85b19198305c082729a4a7cf5dc289b52125f163"
        ];

        // Web Crypto API helper to generate SHA-256 string
        async function sha256(string) {
            const utf8 = new TextEncoder().encode(string);
            const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const passwordInput = document.getElementById('passwordInput');
        const toggleVisibility = document.getElementById('toggleVisibility');
        const eyeIcon = document.getElementById('eyeIcon');
        const strengthText = document.getElementById('strengthText');
        const strengthBar = document.getElementById('strengthBar');
        const feedbackPanel = document.getElementById('feedbackPanel');
        const reuseAlert = document.getElementById('reuseAlert');
        const requirementList = document.getElementById('requirementList');
        const suggestedPass = document.getElementById('suggestedPass');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const copyIcon = document.getElementById('copyIcon');

        // 1. Live Analyzer Logic
        passwordInput.addEventListener('input', async () => {
            const val = passwordInput.value;
            if (!val) {
                resetUI();
                return;
            }

            feedbackPanel.classList.remove('hidden');

            // Initialize criteria checks
            const criteria = [
                { label: "At least 12 characters", valid: val.length >= 12 },
                { label: "Contains uppercase letter", valid: /[A-Z]/.test(val) },
                { label: "Contains lowercase letter", valid: /[a-z]/.test(val) },
                { label: "Contains a number", valid: /\d/.test(val) },
                { label: "Contains special character", valid: /[^A-Za-z0-9]/.test(val) }
            ];

            // Sequential/Common Pattern Penalty
            const isSequential = /(123|abc|qwerty|password)/i.test(val);

            // Compute Score
            let score = criteria.filter(c => c.valid).length;
            if (isSequential && score > 0) score = Math.max(1, score - 1);
            if (val.length < 8 && score > 0) score = 1; // Strict floor if critically short

            // Render Strength Bar and Classes
            updateStrengthIndicator(score, val.length);

            // Render Checks List
            requirementList.innerHTML = criteria.map(c => `
                <div class="flex items-center gap-2 text-xs ${c.valid ? 'text-emerald-400' : 'text-slate-500'}">
                    <i class="fa-solid ${c.valid ? 'fa-circle-check' : 'fa-circle-dot'}"></i>
                    <span>${c.label}</span>
                </div>
            `).join('') + (isSequential ? `
                <div class="flex items-center gap-2 text-xs text-amber-400">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Avoid obvious patterns (e.g. '123')</span>
                </div>
            ` : '');

            // Cryptographic History Lookup Simulation
            const inputHash = await sha256(val);
            if (MOCK_PASSWORD_DB_HASHES.includes(inputHash)) {
                reuseAlert.classList.remove('hidden');
                updateStrengthIndicator(0, val.length, true);
            } else {
                reuseAlert.classList.add('hidden');
            }
        });

        function updateStrengthIndicator(score, length, isReused = false) {
            if (isReused) {
                strengthText.textContent = "Compromised / Reused 🚨";
                strengthBar.className = "h-full bg-rose-500 transition-all duration-300";
                strengthBar.style.width = "100%";
                return;
            }

            if (length < 8) {
                strengthText.textContent = "Too Short ❌";
                strengthText.className = "text-rose-500 font-bold";
                strengthBar.className = "h-full bg-rose-500 transition-all duration-300";
                strengthBar.style.width = "20%";
                return;
            }

            let text = "Weak ⚠️";
            let colorClass = "bg-rose-500";
            let textClass = "text-rose-500 font-bold";
            let width = "40%";

            if (score >= 5) {
                text = "Strong 💪";
                colorClass = "bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.3)]";
                textClass = "text-emerald-400 font-bold";
                width = "100%";
            } else if (score >= 3) {
                text = "Moderate 😐";
                colorClass = "bg-amber-500";
                textClass = "text-amber-400 font-bold";
                width = "70%";
            }

            strengthText.textContent = text;
            strengthText.className = textClass;
            strengthBar.className = `h-full ${colorClass} transition-all duration-300`;
            strengthBar.style.width = width;
        }

        function resetUI() {
            strengthText.textContent = "Empty";
            strengthText.className = "text-slate-500 font-bold";
            strengthBar.style.width = "0%";
            feedbackPanel.classList.add('hidden');
            reuseAlert.classList.add('hidden');
        }

        // 2. Hide / Show Input
        toggleVisibility.addEventListener('click', () => {
            const isPass = passwordInput.type === 'password';
            passwordInput.type = isPass ? 'text' : 'password';
            eyeIcon.className = isPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        // 3. Cryptographically Secure Password Generator
        function generateSecurePassword() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
            const len = 15;
            let result = "";
            
            // Web Crypto API random values
            const randomValues = new Uint32Array(len);
            window.crypto.getRandomValues(randomValues);
            
            for (let i = 0; i < len; i++) {
                result += chars[randomValues[i] % chars.length];
            }
            suggestedPass.textContent = result;
        }

        generateBtn.addEventListener('click', generateSecurePassword);

        // 4. Clipboard API functionality
        copyBtn.addEventListener('click', () => {
            const textToCopy = suggestedPass.textContent;
            if(textToCopy === "--------") return;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                copyIcon.className = "fa-solid fa-check text-emerald-400";
                setTimeout(() => {
                    copyIcon.className = "fa-regular fa-copy";
                }, 2000);
            });
        });

        // Initialization
        generateSecurePassword();
    </script>
</body>
</html>
